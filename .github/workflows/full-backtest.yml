name: BEARD Full Backtest Verification

on:
  pull_request:

jobs:
  full-backtest:
    if: github.head_ref == 'ci/verify-beard'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Build 2015-2025 real nflverse feature frame
        run: |
          mkdir -p artifacts
          python -m beard_model.pipeline \
            --seasons 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 \
            --output artifacts/beard_matchups_2015_2025.parquet
      - name: Inspect historical frame before modeling
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          p = pd.read_parquet('artifacts/beard_matchups_2015_2025.parquet')
          summary = {
              'rows': int(len(p)),
              'columns': int(len(p.columns)),
              'seasons': {str(int(s)): int(n) for s, n in p.groupby('season').size().items()},
              'completed_games': int(p['home_margin'].notna().sum()),
              'missing_spread_lines': int(p['spread_line'].isna().sum()),
              'pregame_feature_columns': int(sum(c.startswith(('home_pre_', 'away_pre_', 'diff_pre_')) for c in p.columns)),
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary['rows'] >= 2800
          assert summary['missing_spread_lines'] == 0, 'Missing historical spreads must be handled explicitly before grading.'
          PY
      - name: Run strict chronological closing-line backtest
        run: |
          python -m beard_model.backtest \
            --input artifacts/beard_matchups_2015_2025.parquet \
            --output artifacts/backtest.json > artifacts/backtest_stdout.txt
      - name: Print concise accepted-result candidate
        run: |
          python - <<'PY'
          import json
          r = json.load(open('artifacts/backtest.json'))
          summary = {
              'label': r['label'],
              'warning': r['warning'],
              'feature_count': len(r['features']),
              'validation_metrics': r['validation_metrics'],
              'qualification_policy': r['qualification_policy'],
              'validation_ats': r['validation_ats'],
              'holdout_metrics': r['holdout_metrics'],
              'holdout_ats': r['holdout_ats'],
          }
          open('artifacts/backtest_summary.json','w').write(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert r['qualification_policy']['selected_on_seasons'] == [2024]
          assert all('spread' not in c.lower() and 'market' not in c.lower() and 'odds' not in c.lower() for c in r['features'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: beard-full-backtest
          path: |
            artifacts/backtest.json
            artifacts/backtest_summary.json
            artifacts/backtest_stdout.txt
          retention-days: 30
